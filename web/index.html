<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="StoryLex · 我的英语学习手帐">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="StoryLex">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>StoryLex · 英语学习手帐</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* flutter run injects this blue debug loader after our bootstrap starts. */
    .flutter-loader { display: none !important; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center;
      justify-items: center; gap: 18px; color: #a08f73; font: 15px sans-serif; }
    .loading-dots { display: flex; gap: 8px; }
    .loading-dots i { width: 7px; height: 7px; border-radius: 50%; background: #c7d4b0;
      animation: breathe 1.4s ease-in-out infinite; }
    .loading-dots i:nth-child(2) { animation-delay: .18s; background: #e8d39e; }
    .loading-dots i:nth-child(3) { animation-delay: .36s; background: #e6c8ce; }
    @keyframes breathe { 0%, 80%, 100% { opacity: .4; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) { .loading-dots i { animation: none; } }
  </style>
</head>
<body style="margin:0;background:#fcf8ed">
  <div id="loading" role="status"><span class="loading-dots" aria-hidden="true"><i></i><i></i><i></i></span><span>正在打开你的手帐…</span></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
